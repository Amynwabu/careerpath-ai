openapi: 3.1.0
info:
  title: CareerPathX
  version: 0.1.0
  description: CareerPathX API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profile
    description: User profile management
  - name: work-experience
    description: Work experience entries
  - name: education
    description: Education entries
  - name: skills
    description: Skills management
  - name: certifications
    description: Certifications management
  - name: career-goal
    description: Career goal definition
  - name: analysis
    description: Analysis
  - name: roadmap
    description: Roadmap
  - name: milestones
    description: Progress actions
  - name: dashboard
    description: Dashboard summary data
  - name: opportunities
    description: Deterministic vacancy ingestion, matching, ranking and explanation
  - name: application-intelligence
    description: Evidence-grounded CV analysis, claim-safe tailoring and application readiness
  - name: interview-intelligence
    description: Evidence-grounded interview planning, STAR coaching and practice readiness
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [auth]
      summary: Rotate the refresh token and issue a new access session
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Refresh session is invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/completion:
    get:
      operationId: getProfileCompletion
      tags: [profile]
      summary: Get profile completion percentage
      responses:
        "200":
          description: Profile completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCompletion"

  /work-experiences:
    get:
      operationId: listWorkExperiences
      tags: [work-experience]
      summary: List work experiences
      responses:
        "200":
          description: List of work experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkExperience"
    post:
      operationId: createWorkExperience
      tags: [work-experience]
      summary: Create a work experience entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkExperienceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkExperience"

  /work-experiences/{id}:
    patch:
      operationId: updateWorkExperience
      tags: [work-experience]
      summary: Update a work experience entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkExperienceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkExperience"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWorkExperience
      tags: [work-experience]
      summary: Delete a work experience entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /education:
    get:
      operationId: listEducation
      tags: [education]
      summary: List education entries
      responses:
        "200":
          description: List of education entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Education"
    post:
      operationId: createEducation
      tags: [education]
      summary: Create an education entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEducationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"

  /education/{id}:
    patch:
      operationId: updateEducation
      tags: [education]
      summary: Update an education entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEducationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEducation
      tags: [education]
      summary: Delete an education entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List user skills
      responses:
        "200":
          description: List of skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      operationId: createSkill
      tags: [skills]
      summary: Add a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /skills/{id}:
    delete:
      operationId: deleteSkill
      tags: [skills]
      summary: Remove a skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /certifications:
    get:
      operationId: listCertifications
      tags: [certifications]
      summary: List certifications
      responses:
        "200":
          description: List of certifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certification"
    post:
      operationId: createCertification
      tags: [certifications]
      summary: Add a certification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"

  /certifications/{id}:
    delete:
      operationId: deleteCertification
      tags: [certifications]
      summary: Remove a certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /career-goal:
    get:
      operationId: getCareerGoal
      tags: [career-goal]
      summary: Get career goal
      responses:
        "200":
          description: Career goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerGoal"
        "404":
          description: Not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setCareerGoal
      tags: [career-goal]
      summary: Set or update career goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCareerGoalBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerGoal"

  /analysis:
    post:
      operationId: runAnalysis
      tags: [analysis]
      summary: Run analysis
      responses:
        "201":
          description: Analysis created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAnalysis"
        "400":
          description: Incomplete profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/latest:
    get:
      operationId: getLatestAnalysis
      tags: [analysis]
      summary: Get latest analysis
      responses:
        "200":
          description: Latest analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAnalysis"
        "404":
          description: No analysis yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/history:
    get:
      operationId: listAnalysisHistory
      tags: [analysis]
      summary: Get past results
      responses:
        "200":
          description: List of past analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSummary"

  /roadmap:
    get:
      operationId: getRoadmap
      tags: [roadmap]
      summary: Get current roadmap
      responses:
        "200":
          description: Full roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "404":
          description: No roadmap generated yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: List progress actions
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"

  /milestones/{id}/complete:
    patch:
      operationId: completeMilestone
      tags: [milestones]
      summary: Mark milestone as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/skill-gaps:
    get:
      operationId: getSkillGaps
      tags: [dashboard]
      summary: Get top skill gaps
      responses:
        "200":
          description: Skill gap breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillGap"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /profile/documents/parse:
    post:
      operationId: parseCareerDocument
      tags: [profile]
      summary: Safely extract text from an uploaded career document
      description: Stateless extraction only. Content is not persisted and external links are never followed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerDocumentParseBody"
      responses:
        "200":
          description: Extracted document and non-sensitive processing metadata
        "400":
          description: Invalid, unsupported, corrupt, encrypted, or unsafe document
        "413":
          description: Document exceeds the 8 MiB limit

  /profile/build:
    post:
      operationId: buildCareerProfile
      tags: [profile]
      summary: Build a versioned career profile from extracted evidence
      description: Deterministic profile construction. A successful authenticated request commits an owner-scoped profile and returns persistenceStatus persistent.
      responses:
        "200":
          description: Career profile with provenance, confidence, and unresolved evidence

  /profile/validate:
    post:
      operationId: validateCareerProfile
      tags: [profile]
      summary: Validate profile structure, confidence, provenance, and date consistency
      responses:
        "200":
          description: Validation errors, warnings, and human-review items

  /profile/redact:
    post:
      operationId: redactCareerProfile
      tags: [profile]
      summary: Return a redacted copy of a career profile
      responses:
        "200":
          description: Redacted profile; the supplied profile is not mutated or persisted

  /profile/resolve:
    post:
      operationId: resolveCareerProfile
      tags: [profile]
      summary: Resolve profile evidence against the published taxonomy
      description: Fails closed while taxonomy v2026.1 remains unpublished_candidate.
      responses:
        "200":
          description: Career profile with canonical resolution
        "503":
          description: No published taxonomy is available

  /profile/corrections:
    post:
      operationId: applyCareerProfileCorrection
      tags: [profile]
      summary: Apply an attributable correction to an allowed profile field
      responses:
        "200":
          description: Corrected profile with immutable correction evidence

  /profile/career-profile:
    get:
      operationId: getCareerProfile
      tags: [profile]
      summary: Career profile persistence capability
      responses:
        "501":
          description: Persistence is explicitly not implemented

  /career-goals:
    post:
      operationId: createStructuredCareerGoal
      tags: [career-goal]
      summary: Validate and persist a versioned career goal
      description: Free text remains unresolved unless the published Occupation Resolver resolves it. Personal constraints shape planning and never reduce readiness scores.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Owner-scoped goal with persistenceStatus persistent
        "400":
          $ref: "#/components/responses/CareerPlanningError"

  /career-goals/validate:
    post:
      operationId: validateStructuredCareerGoal
      tags: [career-goal]
      summary: Validate goal type, target, horizon, and constraint ranges
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Validation result

  /career-goals/resolve:
    post:
      operationId: resolveCareerGoalTarget
      tags: [career-goal]
      summary: Resolve a goal through the published deterministic Occupation Resolver
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Canonical resolution or explicit target_unresolved result
        "503":
          $ref: "#/components/responses/TaxonomyUnavailable"

  /career-assessments:
    post:
      operationId: createCareerReadinessAssessment
      tags: [analysis]
      summary: Orchestrate the existing published-taxonomy Readiness Engine
      description: Requires a valid Career Profile, confirmed current occupation, resolved target occupation and resolved canonical skills.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Explainable versioned readiness assessment
        "400":
          $ref: "#/components/responses/CareerPlanningError"
        "503":
          $ref: "#/components/responses/TaxonomyUnavailable"

  /career-plans:
    get:
      operationId: getCareerPlansPersistenceStatus
      tags: [roadmap]
      summary: Career-plan persistence capability
      security:
        - cookieAuth: []
      responses:
        "501":
          description: Paginated owner-scoped plans with persistenceStatus persistent
    post:
      operationId: createCareerActionPlan
      tags: [roadmap]
      summary: Generate an evidence-backed plan from a completed assessment
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Versioned action plan with actions, milestones, risks and dependencies
        "400":
          $ref: "#/components/responses/CareerPlanningError"

  /career-plans/compare:
    post:
      operationId: compareCareerPlanScenarios
      tags: [roadmap]
      summary: Compare one to three published-taxonomy targets
      description: Salary is not used for ranking and unsupported transitions are not asserted.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Deterministic comparison
        "503":
          $ref: "#/components/responses/TaxonomyUnavailable"

  /career-plans/reassess:
    post:
      operationId: reassessCareerPlan
      tags: [roadmap]
      summary: Create a new assessment linked to the preserved prior assessment
      security:
        - cookieAuth: []
      responses:
        "200":
          description: New assessment with score and gap changes

  /career-plans/validate:
    post:
      operationId: validateCareerActionPlan
      tags: [roadmap]
      summary: Validate explanations, references, and dependency ordering
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Plan validation result

  /career-plans/export:
    post:
      operationId: exportCareerActionPlan
      tags: [roadmap]
      summary: Export JSON, Markdown, or printable HTML
      description: Advisor sharing is redacted by default. PDF export is not implemented.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Stateless structured export

  /career-plans/actions/update:
    post:
      operationId: updateCareerPlanAction
      tags: [roadmap]
      summary: Create an attributed plan revision with an updated action status
      description: Completion remains distinct from evidence verification.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: New immutable plan version

  /career-plans/evidence:
    post:
      operationId: createCareerPlanEvidenceMetadata
      tags: [roadmap]
      summary: Persist an owner-scoped evidence metadata record
      description: File upload and durable evidence storage are not implemented.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Evidence metadata with explicit verification state

  /profiles:
    get:
      operationId: listPersistentCareerProfiles
      tags: [profile]
      summary: List the authenticated user's profiles with cursor pagination
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageCursor"
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Owner-scoped profile page
    post:
      operationId: persistCareerProfile
      tags: [profile]
      summary: Persist a complete validated Career Profile transactionally
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Profile committed with persistenceStatus persistent
        "409":
          $ref: "#/components/responses/RecordVersionConflict"

  /profiles/{profileId}:
    parameters:
      - in: path
        name: profileId
        required: true
        schema:
          type: string
    get:
      operationId: getPersistentCareerProfile
      tags: [profile]
      summary: Get an owned profile, isolated personal data, entities and corrections
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Owned profile
        "404":
          description: Not found; unauthorized IDs return the same response
    patch:
      operationId: updatePersistentCareerProfile
      tags: [profile]
      summary: Update mutable profile fields using optimistic concurrency
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordVersion"
      responses:
        "200":
          description: Updated profile and incremented record version
        "409":
          $ref: "#/components/responses/RecordVersionConflict"
    delete:
      operationId: archivePersistentCareerProfile
      tags: [profile]
      summary: Soft-delete and archive an owned profile
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/RecordVersion"
      responses:
        "200":
          description: Profile marked for lifecycle processing

  /profile-documents/upload:
    post:
      operationId: uploadPrivateCareerDocument
      tags: [profile]
      summary: Validate, scan and privately store an authenticated document
      description: Defaults to persist_profile_only. Production requires scan_status clean. Object keys and signed URLs are never returned.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Private document metadata with persistenceStatus persistent
        "429":
          description: User/IP rate limit or configurable quota exceeded
        "503":
          description: Private storage or malware scanner unavailable

  /profile-documents:
    get:
      operationId: listPrivateCareerDocuments
      tags: [profile]
      summary: List owned source-document metadata
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Metadata only; no storage keys

  /profile-documents/{documentId}:
    parameters:
      - in: path
        name: documentId
        required: true
        schema:
          type: string
    get:
      operationId: getPrivateCareerDocumentMetadata
      tags: [profile]
      summary: Get owned document metadata without storage credentials
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Document scan, parse and retention state
    delete:
      operationId: deletePrivateCareerDocument
      tags: [profile]
      summary: Delete the private storage object before marking metadata deleted
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Configured storage confirmed deletion

  /advisor-access:
    get:
      operationId: listAdvisorAccessGrants
      tags: [profile]
      summary: List grants created by the authenticated owner
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Scoped grants
    post:
      operationId: grantAdvisorAccess
      tags: [profile]
      summary: Grant explicit, limited advisor access
      description: Supported scopes are profile_read, redacted_profile_read, assessment_read, plan_read, plan_comment and evidence_review.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Active auditable grant

  /advisor-access/{grantId}:
    delete:
      operationId: revokeAdvisorAccess
      tags: [profile]
      summary: Revoke an owned advisor grant
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: grantId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked grant

  /account/export:
    post:
      operationId: requestCareerDataExport
      tags: [profile]
      summary: Create an expiring persistent export request
      description: Supports JSON, Markdown and ZIP metadata bundles. Private object files are excluded unless separately and securely requested.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Export request with generated_export retention class

  /account/deletion-request:
    get:
      operationId: getCareerDataDeletionRequest
      tags: [profile]
      summary: Get the authenticated user's latest deletion state
      security:
        - cookieAuth: []
