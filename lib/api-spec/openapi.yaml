components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: careerpath_session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        maxLength: 200
    RecordVersion:
      in: header
      name: If-Match
      required: true
      description: Current integer record version
    CvSessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
    CvDraftId:
      in: path
      name: draftId
      required: true
      schema: { type: string }
    RecommendationId:
      in: path
      name: recommendationId
      required: true
      schema: { type: string }
    InterviewSessionId:
      in: path
      name: sessionId
      required: true
      schema: { type: string }
    InterviewQuestionId:
      in: path
      name: questionId
      required: true
      schema: { type: string }
      schema:
        type: integer
        minimum: 1
    PageLimit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    PageCursor:
      in: query
      name: cursor
      schema:
        type: string
  responses:
    CareerPlanningError:
      description: Invalid or incomplete deterministic planning input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CareerPlanningError"
    TaxonomyUnavailable:
      description: No published taxonomy snapshot is available
      content:
        application/json:
          schema:
            allOf:
              - $ref: "#/components/schemas/CareerPlanningError"
              - type: object
                properties:
                  taxonomyStatus:
                    type: string
                    const: unpublished_candidate
    RecordVersionConflict:
      description: The supplied record version is stale
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: string
                const: record_version_conflict
            required: [error, code]

  schemas:
    CvOptimisationSessionRequest:
      type: object
      required: [profile, vacancy, matchResult, sourceCv]
      properties:
        profile: { type: object, additionalProperties: true }
        vacancy: { $ref: "#/components/schemas/CanonicalVacancy" }
        matchResult: { $ref: "#/components/schemas/EmployabilityResult" }
        sourceCv:
          type: object
          required: [fileType, text, sectionHeadings]
          properties:
            fileType:
              type: string
              enum: [pdf, docx, text, markdown, other]
            text: { type: string }
            sectionHeadings: { type: array, items: { type: string } }
            tableCount: { type: integer, minimum: 0 }
            columnCount: { type: integer, minimum: 1 }
            textBoxCount: { type: integer, minimum: 0 }
            headerHasCriticalContent: { type: boolean }
            footerHasCriticalContent: { type: boolean }
            imageOnlyContent: { type: boolean }
            embeddedScripts: { type: boolean }
            hiddenTextDetected: { type: boolean }
        targetFormat:
          type: string
          enum: [one_page_cv, two_page_cv, extended_academic_cv, executive_cv, technical_cv, graduate_cv]
        targetLocale: { type: string }
        selectedTemplate:
          type: string
          enum: [professional, technical, executive, graduate, academic, career_change]
    RawVacancy:
      type: object
      additionalProperties: false
      required: [source, sourceReference, title, description, postedDate]
      properties:
        jobId: { type: string }
        source:
          type: string
          enum: [manual, employer_portal, csv, json, xml, rest_api]
        sourceReference: { type: string }
        title: { type: string }
        description: { type: string }
        location: { type: string }
        remoteType: { type: string }
        employmentType: { type: string }
        salaryMin: { type: number, minimum: 0 }
        salaryMax: { type: number, minimum: 0 }
        salaryPeriod:
          type: string
          enum: [hourly, daily, weekly, monthly, annual]
        currency: { type: string, minLength: 3, maxLength: 3 }
        postedDate: { type: string, format: date-time }
        expiryDate: { type: string, format: date-time }
        applicationUrl: { type: string, format: uri }
        occupationCode: { type: string }
        taxonomyVersion: { type: string }
        requiredSkills: { type: array, items: { type: string } }
