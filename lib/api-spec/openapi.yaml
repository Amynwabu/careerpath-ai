openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: CareerPath AI Architect API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profile
    description: User profile management
  - name: work-experience
    description: Work experience entries
  - name: education
    description: Education entries
  - name: skills
    description: Skills management
  - name: certifications
    description: Certifications management
  - name: career-goal
    description: Career goal definition
  - name: analysis
    description: AI career analysis
  - name: roadmap
    description: Career roadmap
  - name: milestones
    description: Progress milestones
  - name: dashboard
    description: Dashboard summary data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Reset email queued if account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a signed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [auth]
      summary: Verify email using a signed token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenBody"
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                required: [user]
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: verifyEmailLink
      tags: [auth]
      summary: Verify email from signed link and redirect to frontend
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirects to frontend login page with verification status

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/completion:
    get:
      operationId: getProfileCompletion
      tags: [profile]
      summary: Get profile completion percentage
      responses:
        "200":
          description: Profile completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileCompletion"

  /profile/import-cv:
    post:
      operationId: importCv
      tags: [profile]
      summary: Parse a CV and return editable profile suggestions
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required: [file]
      responses:
        "200":
          description: Parsed CV suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvImportSuggestion"
        "400":
          description: Invalid upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Could not parse upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /work-experiences:
    get:
      operationId: listWorkExperiences
      tags: [work-experience]
      summary: List work experiences
      responses:
        "200":
          description: List of work experiences
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkExperience"
    post:
      operationId: createWorkExperience
      tags: [work-experience]
      summary: Create a work experience entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkExperienceBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkExperience"

  /work-experiences/{id}:
    patch:
      operationId: updateWorkExperience
      tags: [work-experience]
      summary: Update a work experience entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkExperienceBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkExperience"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWorkExperience
      tags: [work-experience]
      summary: Delete a work experience entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /education:
    get:
      operationId: listEducation
      tags: [education]
      summary: List education entries
      responses:
        "200":
          description: List of education entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Education"
    post:
      operationId: createEducation
      tags: [education]
      summary: Create an education entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEducationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"

  /education/{id}:
    patch:
      operationId: updateEducation
      tags: [education]
      summary: Update an education entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEducationBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Education"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteEducation
      tags: [education]
      summary: Delete an education entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /skills:
    get:
      operationId: listSkills
      tags: [skills]
      summary: List user skills
      responses:
        "200":
          description: List of skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      operationId: createSkill
      tags: [skills]
      summary: Add a skill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSkillBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"

  /skills/{id}:
    delete:
      operationId: deleteSkill
      tags: [skills]
      summary: Remove a skill
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /certifications:
    get:
      operationId: listCertifications
      tags: [certifications]
      summary: List certifications
      responses:
        "200":
          description: List of certifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certification"
    post:
      operationId: createCertification
      tags: [certifications]
      summary: Add a certification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCertificationBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certification"

  /certifications/{id}:
    delete:
      operationId: deleteCertification
      tags: [certifications]
      summary: Remove a certification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /career-goal:
    get:
      operationId: getCareerGoal
      tags: [career-goal]
      summary: Get career goal
      responses:
        "200":
          description: Career goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerGoal"
        "404":
          description: Not set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setCareerGoal
      tags: [career-goal]
      summary: Set or update career goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCareerGoalBody"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerGoal"

  /analysis:
    post:
      operationId: runAnalysis
      tags: [analysis]
      summary: Run AI career analysis
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Optional key for safely retrying analysis creation without creating duplicate analyses. Reuse the same value for retries of the same request.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "201":
          description: Analysis created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAnalysis"
        "400":
          description: Incomplete profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/latest:
    get:
      operationId: getLatestAnalysis
      tags: [analysis]
      summary: Get latest analysis
      responses:
        "200":
          description: Latest analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerAnalysis"
        "404":
          description: No analysis yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analysis/history:
    get:
      operationId: listAnalysisHistory
      tags: [analysis]
      summary: Get analysis history
      responses:
        "200":
          description: List of past analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnalysisSummary"

  /roadmap:
    get:
      operationId: getRoadmap
      tags: [roadmap]
      summary: Get current roadmap
      responses:
        "200":
          description: Full roadmap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Roadmap"
        "404":
          description: No roadmap generated yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /milestones:
    get:
      operationId: listMilestones
      tags: [milestones]
      summary: List milestones
      responses:
        "200":
          description: List of milestones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Milestone"

  /milestones/{id}/complete:
    patch:
      operationId: completeMilestone
      tags: [milestones]
      summary: Mark milestone as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated milestone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Milestone"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/skill-gaps:
    get:
      operationId: getSkillGaps
      tags: [dashboard]
      summary: Get top skill gaps
      responses:
        "200":
          description: Skill gap breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillGap"

  /dashboard/activity:
    get:
      operationId: getRecentActivity
      tags: [dashboard]
      summary: Get recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    RegisterBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
      required: [name, email, password]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
      required: [email, password]

    ForgotPasswordBody:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required: [email]

    ResetPasswordBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 8
          maxLength: 72
      required: [token, password]

    TokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required: [token]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        role:
          type: string
        createdAt:
          type: string
      required: [id, name, email, emailVerified, role, createdAt]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
      required: [user, csrfToken]

    Profile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        currentRole:
          type: ["string", "null"]
        totalExperienceMonths:
          type: ["integer", "null"]
        industry:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        professionalSummary:
          type: ["string", "null"]
        preferredLearningStyle:
          type: ["string", "null"]
        weeklyLearningMinutes:
          type: ["integer", "null"]
        salaryAspiration:
          type: ["string", "null"]
        careerLevel:
          type: ["string", "null"]
        cvImportCompletedAt:
          type: ["string", "null"]
        updatedAt:
          type: string
      required: [id, userId, updatedAt]

    UpdateProfileBody:
      type: object
      properties:
        currentRole:
          type: string
        totalExperienceMonths:
          type: integer
        industry:
          type: string
        location:
          type: string
        phone:
          type: string
        linkedinUrl:
          type: string
        professionalSummary:
          type: string
        preferredLearningStyle:
          type: string
        weeklyLearningMinutes:
          type: integer
        salaryAspiration:
          type: string
        careerLevel:
          type: string
        cvImportCompletedAt:
          type: string

    ProfileCompletion:
      type: object
      properties:
        percentage:
          type: integer
        missingFields:
          type: array
          items:
            type: string
        completedSections:
          type: array
          items:
            type: string
      required: [percentage, missingFields, completedSections]

    CvImportSuggestion:
      type: object
      properties:
        fileName:
          type: string
        mimeType:
          type: string
        profile:
          $ref: "#/components/schemas/CvProfileSuggestion"
        workExperiences:
          type: array
          items:
            $ref: "#/components/schemas/CvWorkExperienceSuggestion"
        education:
          type: array
          items:
            $ref: "#/components/schemas/CvEducationSuggestion"
        skills:
          type: array
          items:
            $ref: "#/components/schemas/CvSkillSuggestion"
        certifications:
          type: array
          items:
            $ref: "#/components/schemas/CvCertificationSuggestion"
        warnings:
          type: array
          items:
            type: string
      required: [fileName, mimeType, profile, workExperiences, education, skills, certifications, warnings]

    CvProfileSuggestion:
      type: object
      properties:
        currentRole:
          type: string
        totalExperienceMonths:
          type: integer
        industry:
          type: string
        location:
          type: string
        phone:
          type: string
        linkedinUrl:
          type: string
        professionalSummary:
          type: string
        careerLevel:
          type: string

    CvWorkExperienceSuggestion:
      type: object
      properties:
        company:
          type: string
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
        description:
          type: string
        skills:
          type: string
      required: [company, title, startDate, isCurrent]

    CvEducationSuggestion:
      type: object
      properties:
        institution:
          type: string
        degree:
          type: string
        fieldOfStudy:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
      required: [institution, degree, startDate, isCurrent]

    CvSkillSuggestion:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        proficiencyLevel:
          type: string
      required: [name, category, proficiencyLevel]

    CvCertificationSuggestion:
      type: object
      properties:
        name:
          type: string
        issuingOrganization:
          type: string
        issueDate:
          type: string
          format: date
        expiryDate:
          type: string
          format: date
      required: [name, issuingOrganization]

    WorkExperience:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        company:
          type: string
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        isCurrent:
          type: boolean
        description:
          type: ["string", "null"]
        skills:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, userId, company, title, startDate, isCurrent, createdAt]

    CreateWorkExperienceBody:
      type: object
      properties:
        company:
          type: string
        title:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
        description:
          type: string
        skills:
          type: string
      required: [company, title, startDate, isCurrent]

    Education:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        institution:
          type: string
        degree:
          type: string
        fieldOfStudy:
          type: ["string", "null"]
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
          format: date
        isCurrent:
          type: boolean
        createdAt:
          type: string
      required: [id, userId, institution, degree, startDate, isCurrent, createdAt]

    CreateEducationBody:
      type: object
      properties:
        institution:
          type: string
        degree:
          type: string
        fieldOfStudy:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        isCurrent:
          type: boolean
      required: [institution, degree, startDate, isCurrent]

    Skill:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        category:
          type: string
        proficiencyLevel:
          type: string
        createdAt:
          type: string
      required: [id, userId, name, category, proficiencyLevel, createdAt]

    CreateSkillBody:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        proficiencyLevel:
          type: string
      required: [name, category, proficiencyLevel]

    Certification:
      type: object
