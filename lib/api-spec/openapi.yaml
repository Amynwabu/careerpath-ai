      type: object
      required: [items, persistenceStatus]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CanonicalVacancy" }
        count: { type: integer }
        persistenceStatus:
          type: string
          enum: [process_local]
    MatchRequest:
      type: object
      required: [profile]
      properties:
        jobId: { type: string }
        jobIds: { type: array, items: { type: string } }
        profile: { type: object, additionalProperties: true }
        preferences: { type: object, additionalProperties: true }
        weights: { type: object, additionalProperties: { type: number } }
        experienceYears: { type: number, minimum: 0 }
        qualifications: { type: array, items: { type: string } }
        certifications: { type: array, items: { type: string } }
    EmployabilityResult:
      type: object
      required: [jobId, overallScore, matchBand, confidence, gaps, explanations, disclaimer]
      properties:
        jobId: { type: string }
        overallScore: { type: integer, minimum: 0, maximum: 100 }
        matchBand:
          type: string
          enum: [Perfect Match, Excellent Match, Strong Match, Moderate Match, Weak Match, Poor Match]
        confidence: { type: number, minimum: 0, maximum: 1 }
        gaps: { type: array, items: { type: object, additionalProperties: true } }
        strengths: { type: array, items: { type: object, additionalProperties: true } }
        explanations: { type: array, items: { type: string } }
        disclaimer: { type: string }
    MatchListResponse:
      type: object
      required: [items, entitlements, persistenceStatus]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              vacancy: { $ref: "#/components/schemas/CanonicalVacancy" }
              match: { $ref: "#/components/schemas/EmployabilityResult" }
              rankScore: { type: number }
        entitlements: { type: object, additionalProperties: { type: boolean } }
        persistenceStatus:
          type: string
          enum: [process_local]
