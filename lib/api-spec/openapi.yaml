        - type: object
          required: [jobId, occupationCode, occupationTitle, careerFamily, taxonomyVersion]
          properties:
            jobId: { type: string }
            occupationCode: { type: string }
            occupationTitle: { type: string }
            careerFamily: { type: string }
            requiredSkills: { type: array, items: { type: string } }
            preferredSkills: { type: array, items: { type: string } }
            unresolvedRequiredSkills: { type: array, items: { type: string } }
            unresolvedPreferredSkills: { type: array, items: { type: string } }
            taxonomyVersion: { type: string }
    VacancyImportRequest:
      type: object
      properties:
        vacancy: { $ref: "#/components/schemas/RawVacancy" }
        items:
          type: array
          items: { $ref: "#/components/schemas/RawVacancy" }
        taxonomyVersion: { type: string }
