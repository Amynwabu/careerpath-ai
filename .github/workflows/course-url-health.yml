name: Course URL Health

on:
  schedule:
    - cron: "24 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-course-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check course URLs
        id: course_links
        continue-on-error: true
        run: node scripts/check-course-urls.mjs

      - name: Upload link report
        if: always() && hashFiles('.course-url-report.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: course-url-health-report
          path: |
            .course-url-report.md
            .course-url-report.json

      - name: Open or update broken course URL issue
        if: steps.course_links.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const marker = "course-url-health";
            const report = fs.readFileSync(".course-url-report.md", "utf8");
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = "Course URL health check found broken links";
            const body = `${report}\n\nWorkflow run: ${runUrl}\n\nFix the catalog entry in lib/taxonomy/src/courses.ts, then re-run this workflow.`;

            try {
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: marker,
                color: "0ea5e9",
                description: "Issues opened by the scheduled course URL health check",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: marker,
              state: "open",
              per_page: 10,
            });
            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: [marker],
              });
            }

      - name: Fail when broken course URLs are confirmed
        if: steps.course_links.outcome == 'failure'
        run: exit 1
