name: Staging retention dry run
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
jobs:
  dry-run:
    environment: staging
    runs-on: ubuntu-latest
    concurrency: careerpathx-staging-retention
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.27.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Execute bounded retention dry run
        env:
          DATABASE_URL: ${{ secrets.STAGING_RETENTION_DATABASE_URL }}
          RETENTION_DRY_RUN: "true"
          RETENTION_BATCH_LIMIT: "500"
        run: pnpm --filter @workspace/scripts run career-data:retention
